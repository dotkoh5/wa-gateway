services:
  wa-gateway:
    build: .
    ports:
      - "3100:3100"
    volumes:
      - wa-session:/data/wa-session
    environment:
      - WEBHOOK_URL=https://otterclawd.ai/api/whatsapp/inbound
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - API_TOKEN=${API_TOKEN}
      - WACLI_STORE=/data/wa-session
      - PORT=3100
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  wa-session:
